kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: devopsbatches.tws.com
spec:
  group: tws.com
  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevOpsBatch
    shortNames:
      - tws
      - junoon
      - batches
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: "This is the name of the Devops Batch"
                duration:
                  type: string
                  description: "This is the duration of the Devops Batch "
                mode:
                  type: string
                  description: "This is the mode of the Batch eg. live/recorded"
                platform:
                  type: string
                  description: "This is the platform of the Batch"


